name: Update and publish comic feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "comics.yml"
      - "requirements.txt"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/publish-feeds.yml"
  schedule:
    - cron: "0 5,11,17,23 * * *"
      timezone: "America/Denver"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Test
        run: pytest -q
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Generate feeds
        run: python scripts/generate_feeds.py --base-url "${{ steps.pages.outputs.base_url }}"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify WebSub hub
        run: |
          for feed in xkcd smbc penny-arcade; do
            curl --fail-with-body --retry 3 \
              --data-urlencode "hub.mode=publish" \
              --data-urlencode "hub.url=${{ steps.deployment.outputs.page_url }}${feed}.xml" \
              https://pubsubhubbub.appspot.com/
          done
